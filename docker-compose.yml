services:
  mysql:
    image: mysql:8.0
    container_name: songdo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DATABASE_PASSWORD}
      MYSQL_DATABASE: ${PROD_MYSQL_DATABASE}
      MYSQL_USER: ${PROD_DATABASE_USERNAME}
      MYSQL_PASSWORD: ${PROD_DATABASE_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: songdo-app:local
    container_name: songdo-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_MYSQL_HOST: mysql
      PROD_MYSQL_PORT: ${PROD_MYSQL_PORT}
      PROD_MYSQL_DATABASE: ${PROD_MYSQL_DATABASE}
      PROD_DATABASE_USERNAME: ${PROD_DATABASE_USERNAME}
      PROD_DATABASE_PASSWORD: ${PROD_DATABASE_PASSWORD}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
