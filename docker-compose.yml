services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DATABASE_PASSWORD}
      MYSQL_DATABASE: ${PROD_MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROD_MYSQL_HOST: mysql
      PROD_MYSQL_PORT: 3306
      PROD_MYSQL_DATABASE: ${PROD_MYSQL_DATABASE}
      PROD_DATABASE_USERNAME: ${PROD_DATABASE_USERNAME}
      PROD_DATABASE_PASSWORD: ${PROD_DATABASE_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
